name: Magnus CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Secrets and private data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bounded authenticated package downloads
        run: bash scripts/ci-apt-setup.test.sh && sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - name: Install ripgrep
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: bash scripts/scan-secrets.sh
      - run: bash scripts/check-private-data.sh
      # Release-workflow tests need the YAML dependency and run in verify after npm ci.
      - run: node --test scripts/test-privacy-policy.mjs scripts/test-publish-environment.mjs

  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.3, 26.13.1]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magnus
          POSTGRES_PASSWORD: ci-magnus-password
          POSTGRES_DB: magnus_ideas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magnus -d magnus_ideas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 55449:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://magnus:ci-magnus-password@127.0.0.1:5432/magnus_ideas_ci
      TEST_DATABASE_URL: postgresql://magnus:ci-magnus-password@127.0.0.1:5432/magnus_ideas_ci
      UI_TEST_REDIS_URL: redis://127.0.0.1:55449
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reserve the browser harness ports
        # 55440-55449 sit inside the kernel's ephemeral range, so an outbound
        # connection (to Redis or PostgreSQL) can take 55442 as its source port
        # just before the dashboard binds it. Reserved ports are never auto-assigned.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55440-55449
      - name: Configure bounded authenticated package downloads
        run: bash scripts/ci-apt-setup.test.sh && sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install test tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep redis-server
      - name: Put node on the system PATH
        # Ardent starts Codex and its test fixtures with a minimal system PATH.
        run: sudo ln -sf "$(command -v node)" /usr/bin/node && /usr/bin/node --version
      - run: npm ci
      - run: npm run lockfile:check
      - run: npm run audit:production
      - name: Generate the Prisma client
        run: npm --workspace @hivemagnus/magnus-server run db:generate
      - name: Build, typecheck, test and check packages
        run: npm run verify
      - name: Context-only adoption of a published older Ardent runtime
        run: npm run ardent:context:integration -- --image node:${{ matrix.node-version }}-bookworm-slim
      - name: Apply database migrations
        run: npm --workspace @hivemagnus/magnus-server run db:migrate:deploy
      - name: PostgreSQL 17 client tools (the restore integration test dumps the PostgreSQL 17 service)
        timeout-minutes: 5
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/hive-ci-sources/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Fleet gateway against a real sshd
        run: npm --workspace @hivemagnus/magnus-fleet-gateway run test:ssh
      - name: Server integration tests
        env:
          MAGNUS_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: npm --workspace @hivemagnus/magnus-server run test:integration
      - name: Install Chromium and system dependencies
        timeout-minutes: 8
        run: npm --workspace @hivemagnus/magnus-ui exec playwright install --with-deps chromium
      - name: Browser navigation tests
        run: npm run verify:ui:ci
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-node-${{ matrix.node-version }}
          path: |
            apps/dashboard/test-results
            apps/dashboard/playwright-report-ci
          retention-days: 7

  upgrade-e2e:
    # Install the published 1.0.3 with `magnus init`, upgrade to this commit's packed release,
    # then move a published 2.10.2 agent to 2.10.3 and across the major with --allow-major, exercise agent
    # self-upgrade and self-revert, a broken release's automatic revert, and rollback.
    name: Upgrade end to end (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.3, 26.13.1]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: magnus
          POSTGRES_PASSWORD: ci-magnus-password
          POSTGRES_DB: magnus_ideas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magnus -d magnus_ideas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      E2E_DATABASE_ADMIN_URL: postgresql://magnus:ci-magnus-password@127.0.0.1:5432/magnus_ideas_ci
      E2E_REDIS_URL: redis://127.0.0.1:6379
      # The runner's default pg_dump is older than the PostgreSQL 17 service.
      MAGNUS_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bounded authenticated package downloads
        run: bash scripts/ci-apt-setup.test.sh && sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: PostgreSQL 17 client tools (pg_dump and pg_restore for backups)
        timeout-minutes: 5
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/hive-ci-sources/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - run: npm ci
      - name: Generate the Prisma client
        run: npm --workspace @hivemagnus/magnus-server run db:generate
      - name: Build
        run: npm run build
      - name: Upgrade end to end
        run: bash scripts/e2e/upgrade-e2e.sh
      - name: Service logs
        if: failure()
        run: sudo journalctl -u magnus-server -u magnus-ui -u magnus-agent-e2e -n 300 --no-pager || true

  native:
    # The agent's opt-in native tests: real transient systemd units (user manager), a root-run
    # restricted terminal for a throwaway account, and Docker health metadata. Ubuntu runners
    # have systemd, Docker and passwordless sudo.
    name: Native systemd, root and Docker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Build the contracts and the agent
        run: |
          npm --workspace @hivemagnus/magnus-contracts run build
          npm --workspace @hivemagnus/magnus-agent run build
      - name: Execution supervisor in transient user units
        working-directory: packages/agent
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          systemctl --user is-system-running --wait || true
          SUPERVISOR_NATIVE_TESTS=1 npx vitest run src/executors/execution-supervisor.native.test.ts
      - name: Restricted managed terminal as root, for a throwaway account
        working-directory: packages/agent
        run: |
          sudo useradd --create-home --shell /bin/bash magnus-terminal-ci
          sudo env "PATH=$PATH" MAGNUS_EXECUTION_SUPERVISOR_ENABLED=true MAGNUS_NATIVE_TERMINAL_TEST_USER=magnus-terminal-ci \
            "$(command -v node)" ../../node_modules/vitest/vitest.mjs run src/executors/managed-terminal.native.test.ts
      - name: Embermend Compose inventory against real Docker containers
        working-directory: packages/agent
        env:
          FIXTURE_IMAGE: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
        run: |
          docker pull "$FIXTURE_IMAGE"
          MAGNUS_EMBERMEND_DOCKER_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$FIXTURE_IMAGE")" \
            npx vitest run src/executors/embermend-compose.native.test.ts

  images:
    # The container images build, and the Compose upgrade path works with them:
    # `docker compose pull && up -d` replaced by local tags of this commit.
    name: Container images and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bounded authenticated package downloads
        run: bash scripts/ci-apt-setup.test.sh && sudo env GITHUB_ACTIONS=true bash scripts/ci-apt-setup.sh
      - name: Build the server, console and agent images
        run: |
          version=$(node -p 'require("./package.json").version')
          docker build -f services/control-api/Dockerfile --build-arg MAGNUS_VERSION="$version" -t local/magnus-server:1 -t magnus-server:local .
          docker build -f apps/dashboard/Dockerfile --build-arg MAGNUS_VERSION="$version" -t local/magnus-ui:1 .
          docker build -f packages/agent/Dockerfile --build-arg MAGNUS_VERSION="$version" -t local/magnus-agent:1 .
          docker build -f services/fleet-gateway/Dockerfile --build-arg MAGNUS_VERSION="$version" -t local/magnus-fleet-gateway:1 .
          docker run --rm --entrypoint magnus-agent local/magnus-agent:1 --version
          docker run --rm --entrypoint pg_dump local/magnus-server:1 --version
      - name: Server Compose check
        run: npm --prefix services/control-api run compose:check -- --no-build
      - name: Full stack from docker/compose.yml
        run: bash scripts/e2e/compose-e2e.sh local
