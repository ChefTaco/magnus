name: Publish to npm

# Publishes every @hivemagnus package in this repository whose version is not on npm yet, with
# provenance.
# - Push a tag vX.Y.Z (matching every package version) to publish.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true
      bootstrap:
        description: First publication using a temporary npm-publish environment credential
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read # read environment protection before any publication
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      NPM_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require protected publication environment
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publish-environment.mjs

      - name: Install repository check tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Put node on the system PATH
        # Ardent starts Codex and its test fixtures with a minimal system PATH.
        run: sudo ln -sf "$(command -v node)" /usr/bin/node && /usr/bin/node --version

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: |
          npm run lockfile:check
          npm --workspace @hivemagnus/magnus-server run db:generate
          npm run audit:production
          npm run verify

      - name: Publish
        env:
          # Never expose the bootstrap credential to installation, builds or tests.
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && !inputs.dry_run && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: node scripts/publish-packages.mjs

  images:
    # Container images of the same commit, after the npm packages: server, console and agent.
    # Tags X.Y.Z, X.Y and X (never `latest`, and only X.Y.Z for prereleases). Dry runs build without pushing.
    name: Image ${{ matrix.image.name }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow token
      id-token: write # build provenance attestation
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: magnus-server, dockerfile: services/control-api/Dockerfile }
          - { name: magnus-ui, dockerfile: apps/dashboard/Dockerfile }
          - { name: magnus-agent, dockerfile: packages/agent/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the release version
        id: release
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cheftaco/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MAGNUS_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
