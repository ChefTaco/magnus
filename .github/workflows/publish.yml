name: Publish to npm

# Publishes every @hivemagnus package in scripts/publish-packages.mjs whose version is not on npm
# yet, with provenance. The fleet gateway ships only as an image, and the Oathweave package only
# inside the tarballs that bundle it.
# - Push a tag vX.Y.Z (matching every package version) to publish.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true
      bootstrap:
        description: First publication using a temporary npm-publish environment credential
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read # read environment protection before any publication
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      NPM_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require protected publication environment
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publish-environment.mjs

      - name: Install repository check tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep redis-server

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Put node on the system PATH
        # Ardent starts Codex and its test fixtures with a minimal system PATH.
        run: sudo ln -sf "$(command -v node)" /usr/bin/node && /usr/bin/node --version

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: |
          npm run lockfile:check
          npm --workspace @hivemagnus/magnus-server run db:generate
          npm run audit:production
          npm run verify
          npm run ardent:context:integration -- --image node:24.22.1-bookworm-slim

      - name: Publish
        env:
          # Never expose the bootstrap credential to installation, builds or tests.
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && !inputs.dry_run && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: node scripts/publish-packages.mjs

  images:
    # Container images of the same commit, after the npm packages: server, gateway, console and agent.
    # Tags X.Y.Z, X.Y and X (never `latest`, and only X.Y.Z for prereleases). Dry runs build without pushing.
    name: Image ${{ matrix.image.name }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow token
      id-token: write # build provenance attestation
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: magnus-server, dockerfile: services/control-api/Dockerfile }
          - { name: magnus-fleet-gateway, dockerfile: services/fleet-gateway/Dockerfile }
          - { name: magnus-ui, dockerfile: apps/dashboard/Dockerfile }
          - { name: magnus-agent, dockerfile: packages/agent/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the release version
        id: release
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cheftaco/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.release.outputs.version }}

      - name: Build, execute and scan both architectures before publication
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_REPORT_DIR: ${{ runner.temp }}/image-security-${{ matrix.image.name }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-${{ matrix.image.name }}
        run: |
          mkdir -p "$IMAGE_REPORT_DIR" "$TRIVY_CACHE_DIR"
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" --build-arg "MAGNUS_VERSION=$RELEASE_VERSION" \
              -f "$DOCKERFILE" -t "magnus-runtime-check:$arch" .
            docker run --rm --platform "linux/$arch" --read-only --user 1000:1000 --cap-drop ALL \
              --security-opt no-new-privileges:true --entrypoint node "magnus-runtime-check:$arch" -e \
              'if(process.getuid()!==1000 || !["x64","arm64"].includes(process.arch) || !process.versions.node.startsWith("26."))throw Error("Unexpected runtime"); const db=new (require("node:sqlite").DatabaseSync)(":memory:"); const v=db.prepare("select sqlite_version() v").get().v.split(".").map(Number); if(!(v[0]>3 || v[0]===3 && v[1]>=54))throw Error("Affected embedded SQLite"); db.close();'
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" -v "$IMAGE_REPORT_DIR:/reports" \
              aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --image-src docker --platform "linux/$arch" --scanners vuln --severity HIGH,CRITICAL \
              --format json --output "/reports/$arch.json" --exit-code 1 "magnus-runtime-check:$arch"
          done
      - name: Retain unfiltered security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ matrix.image.name }}
          path: ${{ runner.temp }}/image-security-${{ matrix.image.name }}
          if-no-files-found: ignore

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MAGNUS_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
