# Magnus server, console, PostgreSQL and Redis from the published images.
#
#   cp docker/.env.example docker/.env      # fill in every secret (openssl rand -hex 32 each)
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
#
# Upgrade (never across a major version while MAGNUS_VERSION is a major tag):
#
#   docker compose -f docker/compose.yml --env-file docker/.env pull
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
#
# The server dumps the database into its backups volume and applies pending
# migrations at startup (MAGNUS_AUTO_MIGRATE). A release with a slow or one-way
# migration stops at startup instead (MAGNUS_AUTO_MIGRATE_ALLOW_SLOW), which
# takes the server down until you act: watch unattended pulls. Restoring a dump:
#
#   docker compose -f docker/compose.yml --env-file docker/.env stop magnus-ui magnus-server
#   docker compose -f docker/compose.yml --env-file docker/.env run --rm --no-deps \
#     --entrypoint magnus-server magnus-server restore /var/lib/magnus/backups/<file>.dump --yes
#
# See UPGRADING.md.
name: magnus

services:
  postgres:
    # Digest-pinned; update the tag and digest together (docker buildx imagetools inspect postgres:17-alpine).
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: magnus
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnus -d magnus"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    # Digest-pinned; update the tag and digest together (docker buildx imagetools inspect redis:7-alpine).
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    # The password goes into a private config file inside the container, not onto the redis-server
    # command line (where `ps` and `docker inspect` would show it). The image's entrypoint then
    # drops to the redis user as usual.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  magnus-server:
    image: ${MAGNUS_REGISTRY:-ghcr.io/cheftaco}/magnus-server:${MAGNUS_VERSION:-3}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${MAGNUS_PORT:-4000}:4000"
    volumes:
      - magnus-data:/var/lib/magnus
      # Only the server's certificate (not its key or data) is shared with the console.
      - magnus-server-cert:/var/lib/magnus-cert
    environment:
      NODE_ENV: production
      MAGNUS_TLS_EXPORT_DIR: /var/lib/magnus-cert
      DATABASE_URL: postgresql://magnus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/magnus
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      CONTROL_API_URL: ${CONTROL_API_URL:-https://localhost:4000}
      CORS_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-https://localhost:3000}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-https://localhost:3000}
      MAGNUS_TLS_SELF_SIGNED: ${MAGNUS_TLS_SELF_SIGNED:-true}
      MAGNUS_TLS_HOSTNAMES: ${MAGNUS_TLS_HOSTNAMES:-localhost,magnus-server}
      # Upgrades: dump and migrate at startup; registry check for new releases.
      MAGNUS_AUTO_MIGRATE: ${MAGNUS_AUTO_MIGRATE:-true}
      MAGNUS_AUTO_MIGRATE_ALLOW_SLOW: ${MAGNUS_AUTO_MIGRATE_ALLOW_SLOW:-false}
      MAGNUS_UPDATE_CHECK: ${MAGNUS_UPDATE_CHECK:-true}
      MAGNUS_AGENT_UPGRADES: ${MAGNUS_AGENT_UPGRADES:-true}
      API_SECRET: ${API_SECRET:?API_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Shared node credentials: only for an explicit NODE_AUTH_MODE=compat or warn (deprecated; enforce, the default
      # since 3.0.0, needs neither). Agents enroll with their own keys (docs/NODE_CREDENTIALS.md).
      NODE_AUTH_MODE: ${NODE_AUTH_MODE:-}
      NODE_MANAGER_SECRET: ${NODE_MANAGER_SECRET:-}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?AUDIT_HMAC_SECRET is required}
      RESULT_SIGNING_SECRET: ${RESULT_SIGNING_SECRET:-}
      LOG_INGEST_SIGNING_SECRET: ${LOG_INGEST_SIGNING_SECRET:?LOG_INGEST_SIGNING_SECRET is required}
      CREDENTIAL_ROTATION_KEY: ${CREDENTIAL_ROTATION_KEY:?CREDENTIAL_ROTATION_KEY is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY is required}
      SECURITY_FUSION_MODE: ${SECURITY_FUSION_MODE:-off}
      # Browser console authentication; off unless set (see docs/console-api.md).
      OATHWEAVE_ISSUER: ${OATHWEAVE_ISSUER:-}
      OATHWEAVE_JWKS_URL: ${OATHWEAVE_JWKS_URL:-}
      OATHWEAVE_USERINFO_URL: ${OATHWEAVE_USERINFO_URL:-}
      MAGNUS_OATHWEAVE_IDENTITIES_JSON: ${MAGNUS_OATHWEAVE_IDENTITIES_JSON:-}
      MAGNUS_HERMES_ENABLED: ${MAGNUS_HERMES_ENABLED:-false}
      MAGNUS_CONSOLE_BASE_PATH: ${MAGNUS_CONSOLE_BASE_PATH:-}
    labels:
      com.centurylinklabs.watchtower.enable: "${MAGNUS_WATCHTOWER:-false}"
    security_opt: ["no-new-privileges:true"]
    # The server writes only to its volumes; everything else is read-only.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  magnus-ui:
    image: ${MAGNUS_REGISTRY:-ghcr.io/cheftaco}/magnus-ui:${MAGNUS_VERSION:-3}
    restart: unless-stopped
    depends_on:
      magnus-server: { condition: service_healthy }
    ports:
      - "127.0.0.1:${MAGNUS_UI_PORT:-3000}:3000"
    volumes:
      - magnus-ui-data:/var/lib/magnus-ui
      - magnus-server-cert:/var/lib/magnus-cert:ro
    environment:
      CONTROL_API_URL: https://magnus-server:4000
      CONTROL_API_CA_PATH: ${CONTROL_API_CA_PATH:-/var/lib/magnus-cert/server.crt}
      API_SECRET: ${API_SECRET:?API_SECRET is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CONTROL_NODE_CREDENTIAL_KEY: ${CONTROL_NODE_CREDENTIAL_KEY:?CONTROL_NODE_CREDENTIAL_KEY is required}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-https://localhost:3000}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:?DASHBOARD_ADMIN_PASSWORD_HASH is required}
      MAGNUS_TLS_SELF_SIGNED: ${MAGNUS_TLS_SELF_SIGNED:-true}
      MAGNUS_TLS_HOSTNAMES: ${MAGNUS_TLS_HOSTNAMES:-localhost}
    labels:
      com.centurylinklabs.watchtower.enable: "${MAGNUS_WATCHTOWER:-false}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  redis-data:
  magnus-data:
  magnus-ui-data:
  magnus-server-cert:
