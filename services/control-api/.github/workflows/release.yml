name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release + Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/ChefTaco/magnus-skills.git ../magnus-skills

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install dependencies
        run: npm ci

      - name: Build sibling dependencies
        run: |
          cd ../magnus-skills && npm ci && npm run build

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage sibling deps for Docker
        run: |
          mkdir -p .deps
          cp -r ../magnus-skills .deps/magnus-skills

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
